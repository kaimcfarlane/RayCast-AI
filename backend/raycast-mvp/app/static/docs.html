<!DOCTYPE html>
<html>
<head>
  <title>RayCast AI — API</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.11.0/swagger-ui.css">
  <style>
    :root {
      --rc-bg: #0D0B1A;
      --rc-surface: #161228;
      --rc-surface-hover: #1E1835;
      --rc-surface-elevated: #241E40;
      --rc-border: #2A2445;
      --rc-purple: #9333EA;
      --rc-purple-light: #A855F7;
      --rc-purple-glow: rgba(147, 51, 234, 0.3);
      --rc-purple-subtle: rgba(147, 51, 234, 0.08);
      --rc-violet: #7C3AED;
      --rc-fuchsia: #D946EF;
      --rc-text: #F0ECF9;
      --rc-text-secondary: #9B95B0;
      --rc-text-muted: #6B6580;
      --rc-success: #22C55E;
      --rc-warning: #F59E0B;
      --rc-error: #EF4444;
      --rc-info: #818CF8;
      --rc-get: #818CF8;
      --rc-post: #22C55E;
      --rc-delete: #EF4444;
      --rc-put: #F59E0B;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--rc-bg);
      color: var(--rc-text);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    /* ── CUSTOM HEADER ── */
    .rc-header {
      background: linear-gradient(135deg, #0D0B1A 0%, #1a1040 50%, #0D0B1A 100%);
      border-bottom: 1px solid var(--rc-border);
      padding: 32px 48px;
      position: relative;
      overflow: hidden;
    }

    .rc-header::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -10%;
      width: 50%;
      height: 200%;
      background: radial-gradient(ellipse, var(--rc-purple-glow) 0%, transparent 70%);
      pointer-events: none;
    }

    .rc-header::after {
      content: '';
      position: absolute;
      bottom: -50%;
      right: -5%;
      width: 40%;
      height: 200%;
      background: radial-gradient(ellipse, rgba(217, 70, 239, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }

    .rc-header-content {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
    }

    .rc-logo {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }

    .rc-logo-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--rc-purple) 0%, var(--rc-fuchsia) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 800;
      color: white;
      letter-spacing: -1px;
      box-shadow: 0 4px 20px var(--rc-purple-glow);
    }

    .rc-logo-text {
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--rc-text) 0%, var(--rc-purple-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .rc-version {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      color: var(--rc-purple-light);
      background: var(--rc-purple-subtle);
      border: 1px solid rgba(147, 51, 234, 0.2);
      padding: 3px 10px;
      border-radius: 20px;
      margin-left: 12px;
      letter-spacing: 0.5px;
    }

    .rc-description {
      font-size: 15px;
      color: var(--rc-text-secondary);
      max-width: 600px;
      line-height: 1.6;
      margin-top: 4px;
    }

    .rc-stats {
      display: flex;
      gap: 24px;
      margin-top: 20px;
    }

    .rc-stat {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--rc-text-muted);
    }

    .rc-stat-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--rc-success);
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.4);
    }

    /* ── SWAGGER OVERRIDES ── */
    .swagger-ui {
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Hide default header */
    .swagger-ui .info { display: none !important; }
    .swagger-ui .scheme-container { display: none !important; }

    /* Background */
    .swagger-ui, .swagger-ui .wrapper { background: transparent !important; }

    /* Tag groups */
    .swagger-ui .opblock-tag-section {
      margin-bottom: 8px !important;
    }

    .swagger-ui .opblock-tag {
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      font-size: 18px !important;
      font-weight: 700 !important;
      color: var(--rc-text) !important;
      border-bottom: 1px solid var(--rc-border) !important;
      padding: 16px 4px !important;
      margin: 0 !important;
    }

    .swagger-ui .opblock-tag:hover { background: var(--rc-purple-subtle) !important; }

    .swagger-ui .opblock-tag small {
      font-size: 13px !important;
      color: var(--rc-text-muted) !important;
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      padding: 0 !important;
    }

    /* Operation blocks */
    .swagger-ui .opblock {
      border-radius: 12px !important;
      border: 1px solid var(--rc-border) !important;
      margin-bottom: 8px !important;
      background: var(--rc-surface) !important;
      box-shadow: none !important;
    }

    .swagger-ui .opblock:hover {
      border-color: var(--rc-purple) !important;
      box-shadow: 0 0 0 1px var(--rc-purple-glow) !important;
    }

    .swagger-ui .opblock .opblock-summary {
      padding: 12px 16px !important;
      border: none !important;
    }

    .swagger-ui .opblock .opblock-summary-method {
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 12px !important;
      font-weight: 600 !important;
      border-radius: 6px !important;
      padding: 6px 12px !important;
      min-width: 70px !important;
      text-align: center !important;
    }

    .swagger-ui .opblock .opblock-summary-path {
      font-family: 'JetBrains Mono', monospace !important;
      font-size: 14px !important;
      color: var(--rc-text) !important;
    }

    .swagger-ui .opblock .opblock-summary-description {
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      font-size: 13px !important;
      color: var(--rc-text-secondary) !important;
    }

    /* GET */
    .swagger-ui .opblock-get {
      background: rgba(129, 140, 248, 0.04) !important;
      border-color: rgba(129, 140, 248, 0.15) !important;
    }
    .swagger-ui .opblock-get .opblock-summary-method {
      background: var(--rc-get) !important;
      color: #fff !important;
    }
    .swagger-ui .opblock-get .opblock-summary { border: none !important; }

    /* POST */
    .swagger-ui .opblock-post {
      background: rgba(34, 197, 94, 0.04) !important;
      border-color: rgba(34, 197, 94, 0.15) !important;
    }
    .swagger-ui .opblock-post .opblock-summary-method {
      background: var(--rc-post) !important;
      color: #fff !important;
    }
    .swagger-ui .opblock-post .opblock-summary { border: none !important; }

    /* DELETE */
    .swagger-ui .opblock-delete {
      background: rgba(239, 68, 68, 0.04) !important;
      border-color: rgba(239, 68, 68, 0.15) !important;
    }
    .swagger-ui .opblock-delete .opblock-summary-method {
      background: var(--rc-delete) !important;
      color: #fff !important;
    }
    .swagger-ui .opblock-delete .opblock-summary { border: none !important; }

    /* Expanded operation */
    .swagger-ui .opblock-body {
      background: var(--rc-surface) !important;
    }

    .swagger-ui .opblock-body pre {
      font-family: 'JetBrains Mono', monospace !important;
      background: var(--rc-bg) !important;
      color: var(--rc-text) !important;
      border-radius: 8px !important;
      border: 1px solid var(--rc-border) !important;
      font-size: 13px !important;
    }

    .swagger-ui .opblock-section-header {
      background: var(--rc-surface-hover) !important;
      border: none !important;
      box-shadow: none !important;
    }

    .swagger-ui .opblock-section-header h4 {
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      color: var(--rc-text) !important;
    }

    /* Parameters */
    .swagger-ui .parameters-col_description input,
    .swagger-ui .parameters-col_description textarea,
    .swagger-ui .parameters-col_description select {
      font-family: 'JetBrains Mono', monospace !important;
      background: var(--rc-bg) !important;
      color: var(--rc-text) !important;
      border: 1px solid var(--rc-border) !important;
      border-radius: 8px !important;
      padding: 8px 12px !important;
    }

    .swagger-ui .parameters-col_description input:focus,
    .swagger-ui .parameters-col_description textarea:focus {
      border-color: var(--rc-purple) !important;
      outline: none !important;
      box-shadow: 0 0 0 2px var(--rc-purple-glow) !important;
    }

    .swagger-ui table thead tr th,
    .swagger-ui table thead tr td,
    .swagger-ui .parameter__name,
    .swagger-ui .parameter__type {
      color: var(--rc-text-secondary) !important;
      font-family: 'Plus Jakarta Sans', sans-serif !important;
    }

    .swagger-ui .parameter__name.required span {
      color: var(--rc-purple-light) !important;
    }

    .swagger-ui .parameter__name.required::after {
      color: var(--rc-error) !important;
    }

    /* Buttons */
    .swagger-ui .btn {
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      font-weight: 600 !important;
      border-radius: 8px !important;
      transition: all 0.2s ease !important;
    }

    .swagger-ui .btn.execute {
      background: linear-gradient(135deg, var(--rc-purple) 0%, var(--rc-violet) 100%) !important;
      border: none !important;
      color: white !important;
      padding: 10px 24px !important;
      font-size: 14px !important;
      box-shadow: 0 4px 12px var(--rc-purple-glow) !important;
    }

    .swagger-ui .btn.execute:hover {
      box-shadow: 0 6px 20px var(--rc-purple-glow) !important;
      transform: translateY(-1px) !important;
    }

    .swagger-ui .btn.cancel {
      background: transparent !important;
      border: 1px solid var(--rc-border) !important;
      color: var(--rc-text-secondary) !important;
    }

    /* Authorize button */
    .swagger-ui .btn.authorize {
      background: var(--rc-surface) !important;
      border: 1px solid var(--rc-purple) !important;
      color: var(--rc-purple-light) !important;
      padding: 8px 20px !important;
      font-size: 13px !important;
    }

    .swagger-ui .btn.authorize svg { fill: var(--rc-purple-light) !important; }

    .swagger-ui .authorization__btn svg { fill: var(--rc-purple-light) !important; }

    /* Auth wrapper */
    .swagger-ui .auth-wrapper {
      display: flex;
      justify-content: flex-end;
      padding: 16px 0 !important;
    }

    /* Models section */
    .swagger-ui section.models {
      border: 1px solid var(--rc-border) !important;
      border-radius: 12px !important;
      background: var(--rc-surface) !important;
    }

    .swagger-ui section.models h4 {
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      color: var(--rc-text) !important;
      border: none !important;
    }

    .swagger-ui .model-box {
      background: var(--rc-bg) !important;
      border-radius: 8px !important;
    }

    .swagger-ui .model {
      font-family: 'JetBrains Mono', monospace !important;
      color: var(--rc-text) !important;
    }

    /* Response section */
    .swagger-ui .responses-inner {
      background: transparent !important;
    }

    .swagger-ui .response-col_status {
      font-family: 'JetBrains Mono', monospace !important;
      color: var(--rc-text) !important;
    }

    .swagger-ui .response-col_description {
      color: var(--rc-text-secondary) !important;
    }

    .swagger-ui .responses-table {
      border: none !important;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--rc-bg); }
    ::-webkit-scrollbar-thumb {
      background: var(--rc-surface-elevated);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--rc-purple); }

    /* Dialog / Modal */
    .swagger-ui .dialog-ux .modal-ux {
      background: var(--rc-surface) !important;
      border: 1px solid var(--rc-border) !important;
      border-radius: 16px !important;
    }

    .swagger-ui .dialog-ux .modal-ux-header {
      border-bottom: 1px solid var(--rc-border) !important;
    }

    .swagger-ui .dialog-ux .modal-ux-header h3 {
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      color: var(--rc-text) !important;
    }

    .swagger-ui .dialog-ux .modal-ux-content {
      color: var(--rc-text-secondary) !important;
    }

    .swagger-ui .dialog-ux .modal-ux-content input {
      background: var(--rc-bg) !important;
      color: var(--rc-text) !important;
      border: 1px solid var(--rc-border) !important;
      border-radius: 8px !important;
      font-family: 'JetBrains Mono', monospace !important;
    }

    /* Lock icons */
    .swagger-ui .locked { border-color: var(--rc-purple) !important; }
    .swagger-ui .unlocked { border-color: var(--rc-text-muted) !important; }

    /* Try it out */
    .swagger-ui .try-out__btn {
      border-color: var(--rc-purple) !important;
      color: var(--rc-purple-light) !important;
      border-radius: 8px !important;
      font-family: 'Plus Jakarta Sans', sans-serif !important;
    }

    /* File upload */
    .swagger-ui input[type=file] {
      color: var(--rc-text) !important;
      font-family: 'Plus Jakarta Sans', sans-serif !important;
    }

    /* Response body */
    .swagger-ui .microlight {
      font-family: 'JetBrains Mono', monospace !important;
      background: var(--rc-bg) !important;
      color: var(--rc-text) !important;
      border-radius: 8px !important;
      border: 1px solid var(--rc-border) !important;
    }

    /* Copy button */
    .swagger-ui .copy-to-clipboard { background: var(--rc-surface-elevated) !important; }

    /* All remaining text */
    .swagger-ui p, .swagger-ui span, .swagger-ui td, .swagger-ui th, .swagger-ui label {
      color: var(--rc-text-secondary) !important;
      font-family: 'Plus Jakarta Sans', sans-serif !important;
    }

    /* Links */
    .swagger-ui a { color: var(--rc-purple-light) !important; }
    .swagger-ui a:hover { color: var(--rc-fuchsia) !important; }

    /* Footer */
    .rc-footer {
      text-align: center;
      padding: 32px;
      color: var(--rc-text-muted);
      font-size: 13px;
      border-top: 1px solid var(--rc-border);
      margin-top: 48px;
    }
  </style>
</head>
<body>
  <!-- Custom Header -->
  <div class="rc-header">
    <div class="rc-header-content">
      <div class="rc-logo">
        <div class="rc-logo-icon">RC</div>
        <span class="rc-logo-text">RayCast AI</span>
        <span class="rc-version">v0.1.0</span>
      </div>
      <p class="rc-description">
        Backend API for the multimodal smart glasses assistant. Processes video and audio into structured Context Packets for real-time assistance.
      </p>
      <div class="rc-stats">
        <div class="rc-stat">
          <div class="rc-stat-dot"></div>
          API Online
        </div>
        <div class="rc-stat">FastAPI + Firebase</div>
        <div class="rc-stat">GPT-4o-mini Vision & STT</div>
      </div>
    </div>
  </div>

  <!-- Swagger UI -->
  <div id="swagger-ui"></div>

  <!-- Footer -->
  <div class="rc-footer">
    RayCast AI &mdash; Built by Charles James Jr &bull; University of Florida &bull; Spring 2026
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.11.0/swagger-ui-bundle.js"></script>
  <script>
    SwaggerUIBundle({
      url: '/openapi.json',
      dom_id: '#swagger-ui',
      presets: [
        SwaggerUIBundle.presets.apis,
        SwaggerUIBundle.SwaggerUIStandalonePreset
      ],
      layout: 'BaseLayout',
      deepLinking: true,
      defaultModelsExpandDepth: -1,
      docExpansion: 'list',
      filter: true,
      syntaxHighlight: { theme: 'monokai' }
    });
  </script>
</body>
</html>
